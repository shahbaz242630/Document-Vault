name: Security CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-security:
    name: App security gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Expo Doctor
        run: npm run doctor --workspace @vault/mobile

      - name: Unit tests
        run: npm test --workspaces --if-present

      - name: Coverage thresholds
        run: npm run test:coverage --workspaces --if-present

      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summaries
          path: |
            apps/mobile/coverage/coverage-summary.json
            services/api/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Static security guard
        run: npm run check:security

      - name: GitHub Actions security guard
        run: npm run check:github-actions-security

      - name: Mobile secret scan
        run: npm run check:mobile-secrets

      - name: Phase 1 Definition-of-Done
        run: npm run check:phase1

      - name: Security guard tests
        run: node --test scripts/security-check.test.cjs scripts/mobile-secret-scan.test.cjs scripts/supabase-db-security-check.test.cjs scripts/github-actions-security-check.test.cjs scripts/phase1-dod-check.test.cjs scripts/zap-report-check.test.cjs

      - name: Production dependency audit for high or critical advisories
        run: npm audit --omit=dev --workspaces --audit-level=high

  android-native-compile:
    name: Android native compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: development
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Compile Android debug APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew app:assembleDebug app:assembleRelease -x lint -x test --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Upload standalone Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  android-emulator-smoke:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    needs: android-native-compile
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.3.0

      - name: Download standalone Android APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-apk
          path: android-smoke-apk

      - name: Install emulator system image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Boot emulator and run onboarding smoke test
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name sanduqkin-ci --package "system-images;android-36;google_apis;x86_64"
          nohup "$ANDROID_HOME/emulator/emulator" -avd sanduqkin-ci \
            -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect \
            > /tmp/sanduqkin-emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r android-smoke-apk/app-release.apk
          node scripts/android-emulator-smoke.cjs

      - name: Capture emulator failure evidence
        if: failure()
        run: |
          mkdir -p android-smoke-failure
          adb exec-out screencap -p > android-smoke-failure/screenshot.png || true
          adb logcat -d > android-smoke-failure/logcat.txt || true
          cp /tmp/sanduqkin-emulator.log android-smoke-failure/emulator.txt || true

      - name: Upload emulator failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-smoke-failure
          path: android-smoke-failure
          if-no-files-found: warn
          retention-days: 7

  supabase-live-security:
    name: Supabase live security gates
    runs-on: ubuntu-latest
    needs: app-security
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.106.0

      - name: Start local Supabase
        run: supabase start --workdir supabase

      - name: Apply local Supabase migrations
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            docker exec -i supabase_db_supabase \
              psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "${migration}"
          done

      - name: Live database catalog security check
        run: npm run check:supabase-db-security

      - name: Live RLS attack test
        run: npm run check:supabase-rls

      - name: Stop local Supabase
        if: always()
        run: supabase stop --workdir supabase
