name: Android native build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-compile:
    name: Android native debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Compile Android debug APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Verify debug APK output
        working-directory: apps/mobile/android
        run: test -f app/build/outputs/apk/debug/app-debug.apk
