name: Audit retention processor

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * *"

permissions:
  contents: read

jobs:
  process-expired-audit-events:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call protected retention endpoint
        env:
          PROCESSOR_TOKEN: ${{ secrets.AUDIT_RETENTION_PROCESSOR_TOKEN }}
          PROCESSOR_URL: ${{ secrets.AUDIT_RETENTION_PROCESSOR_URL }}
        run: |
          if [ -z "$PROCESSOR_URL" ] || [ -z "$PROCESSOR_TOKEN" ]; then
            echo "Missing AUDIT_RETENTION_PROCESSOR_URL or AUDIT_RETENTION_PROCESSOR_TOKEN secret." >&2
            exit 1
          fi

          curl --fail-with-body --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request POST \
            --header "Authorization: Bearer ${PROCESSOR_TOKEN}" \
            "$PROCESSOR_URL/internal/audit-retention/process"

  report-processor-status:
    name: Report audit retention processor status
    needs: process-expired-audit-events
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted status reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Open, update, or resolve operational incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROCESSOR_NAME: Audit retention processor
          PROCESSOR_RESULT: ${{ needs.process-expired-audit-events.result }}
        run: node scripts/report-processor-status.cjs
