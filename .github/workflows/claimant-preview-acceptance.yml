name: Claimant Preview acceptance

# Staging wiring W1. Manual only. Runs the real owner and claimant code against the claimant-preview Vercel
# deployment and the shared Supabase project with two run-only synthetic owners, then removes them.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claimant-preview-acceptance
  cancel-in-progress: false

jobs:
  hosted-acceptance:
    if: github.ref == 'refs/heads/claimant-preview'
    environment: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_PROJECT_REF: pxwtexjjttpgtairpepz
      OFFLINE_CODE_V2_OWNER_ORIGIN: https://owner.claimant-preview.sanduqkin.invalid
      OFFLINE_CODE_V2_CLAIMANT_ORIGIN: https://claimant.claimant-preview.sanduqkin.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check claimant variables stay on the claimant-preview Preview only
        run: node scripts/claimant-vercel-env-guard.cjs

      - name: Check the hosted database catalog matches the migrations (read-only)
        run: node scripts/claimant-preview-hosted-catalog-check.cjs

      - name: Run hosted owner and claimant acceptance
        run: npm run test:claimant-preview-acceptance --workspace services/api

      - name: Remove synthetic claimant-preview data
        if: always()
        run: node scripts/claimant-preview-synthetic-cleanup.cjs --apply
