name: iOS TestFlight release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type testflight to build and submit the protected branch.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build and submit iOS
    if: inputs.confirmation == 'testflight'
    runs-on: ubuntu-latest
    environment: Release
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize App Store Connect key
        shell: bash
        working-directory: apps/mobile
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          install -d -m 700 .eas/secrets
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > .eas/secrets/AuthKey_22Q892W9K4.p8
          chmod 600 .eas/secrets/AuthKey_22Q892W9K4.p8

      - name: Build and submit to TestFlight
        working-directory: apps/mobile
        run: >-
          npx --yes eas-cli@21.0.0 build
          --platform ios
          --profile production
          --auto-submit-with-profile production
          --non-interactive
          --freeze-credentials
          --wait

      - name: Remove transient credentials
        if: always()
        shell: bash
        run: rm -rf apps/mobile/.eas/secrets
