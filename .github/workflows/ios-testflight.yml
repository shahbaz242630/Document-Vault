name: iOS TestFlight release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type testflight to build and submit the protected branch.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

jobs:
  release-sbom:
    name: Generate release SBOM
    if: inputs.confirmation == 'testflight'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate production dependency SBOM
        run: npm run sbom:release

      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanduqkin-release-sbom-${{ github.sha }}
          path: artifacts/sanduqkin.cdx.json
          if-no-files-found: error
          retention-days: 90

  build-and-submit:
    name: Build and submit iOS
    if: inputs.confirmation == 'testflight'
    needs: release-sbom
    runs-on: ubuntu-latest
    environment: Release
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.3.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize protected iOS credentials
        shell: bash
        working-directory: apps/mobile
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          install -d -m 700 .eas/secrets
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > .eas/secrets/AuthKey_22Q892W9K4.p8
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > .eas/secrets/ios-distribution.p12
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > .eas/secrets/Sanduqkin_App_Store.mobileprovision
          node -e 'const fs=require("fs");fs.writeFileSync("credentials.json",JSON.stringify({ios:{provisioningProfilePath:".eas/secrets/Sanduqkin_App_Store.mobileprovision",distributionCertificate:{path:".eas/secrets/ios-distribution.p12",password:process.env.IOS_DISTRIBUTION_P12_PASSWORD}}},null,2)+"\n",{mode:0o600})'
          chmod 600 .eas/secrets/AuthKey_22Q892W9K4.p8
          chmod 600 .eas/secrets/ios-distribution.p12 .eas/secrets/Sanduqkin_App_Store.mobileprovision

      - name: Build and submit to TestFlight
        working-directory: apps/mobile
        run: >-
          npx --yes eas-cli@21.0.0 build
          --platform ios
          --profile production
          --auto-submit-with-profile production
          --non-interactive
          --wait

      - name: Remove transient credentials
        if: always()
        shell: bash
        run: rm -rf apps/mobile/.eas/secrets apps/mobile/credentials.json
